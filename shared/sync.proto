syntax = "proto3";

package guardian;

message SyncBatch {
  string device_token = 1;
  string device_id = 2;
  int64 batch_id = 3;
  repeated LocationPoint locations = 4;
  repeated AppUsageEvent app_events = 5;
  repeated NotificationRecord notifications = 6;
  repeated CallLogRecord calls = 7;
  repeated WebHistoryRecord web_history = 8;
  DeviceHealthSnapshot health = 9;
  int64 timestamp = 10;
}

message SyncAck {
  int64 batch_id = 1;
  bool success = 2;
  map<string, int32> inserted = 3;
  repeated string failed_items = 4;
}

message LocationPoint {
  double latitude = 1;
  double longitude = 2;
  double altitude = 3;
  float accuracy = 4;
  float speed = 5;
  float bearing = 6;
  string provider = 7;
  int32 battery_level = 8;
  int64 recorded_at = 9;
}

message AppUsageEvent {
  string package_name = 1;
  string app_name = 2;
  string event_type = 3;
  int64 recorded_at = 4;
}

message NotificationRecord {
  string source_package = 1;
  string app_name = 2;
  string title = 3;
  string text_content = 4;
  string category = 5;
  bool is_removed = 6;
  string extras_json = 7;
  int64 recorded_at = 8;
}

message CallLogRecord {
  string phone_number = 1;
  string contact_name = 2;
  string call_type = 3;
  int32 duration_secs = 4;
  int64 recorded_at = 5;
}

message WebHistoryRecord {
  string url = 1;
  string domain = 2;
  string category = 3;
  bool blocked = 4;
  string block_reason = 5;
  int64 recorded_at = 6;
}

message KeylogRecord {
  string source_package = 1;
  string source_app = 2;
  string event_type = 3;
  string text_content = 4;
  int64 recorded_at = 5;
}

message DeviceHealthSnapshot {
  int32 battery_level = 1;
  bool battery_charging = 2;
  string network_type = 3;
  string wifi_ssid = 4;
  int64 storage_free_mb = 5;
  int64 memory_free_mb = 6;
  bool screen_on = 7;
  string services_active_json = 8;
  int64 recorded_at = 9;
}
